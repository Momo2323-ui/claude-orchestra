# Dependabot configuration
#
# Claude Orchestra is Bash + Markdown — no npm/pip/cargo/etc. dependencies.
# The only dependency source we track is GitHub Actions (the shellcheck workflow).
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor + patch bumps into one PR to reduce noise.
    # Major bumps still get their own PR (might be breaking).
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
