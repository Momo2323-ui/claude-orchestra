<svg width="1200" height="740" viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/><stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b301"/><stop offset="1" stop-color="#ffd45e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7a818c"/>
    </marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f5b301"/>
    </marker>
    <marker id="arrowgr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b9e4b"/>
    </marker>
  </defs>

  <rect width="1200" height="740" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="62" font-size="29" font-weight="800" fill="#fff">How <tspan fill="url(#gold)">Claude Orchestra v2</tspan> routes every request</text>
  <text x="60" y="94" font-size="16.5" fill="#8b919c">The hook reads your words → the score engine picks the team → Claude announces &amp; conducts → usage feeds the rankings.</text>

  <!-- LEFT flow: request → hook → score engine -->
  <rect x="55" y="280" width="140" height="62" rx="12" fill="#1f2229" stroke="#343a44"/>
  <text x="125" y="310" font-size="15" font-weight="600" fill="#dfe3ea" text-anchor="middle">Your</text>
  <text x="125" y="330" font-size="15" font-weight="600" fill="#dfe3ea" text-anchor="middle">request</text>

  <rect x="235" y="280" width="155" height="62" rx="12" fill="#1f2229" stroke="#343a44"/>
  <text x="312" y="306" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Routing hook</text>
  <text x="312" y="327" font-size="12" fill="#8b919c" text-anchor="middle">reads your words</text>

  <rect x="435" y="262" width="205" height="98" rx="14" fill="#2d2d2d" stroke="#f5b301" stroke-width="2"/>
  <text x="537" y="291" font-size="15.5" font-weight="700" fill="#fff" text-anchor="middle">Score engine</text>
  <text x="537" y="313" font-size="12" fill="#cbd0d8" text-anchor="middle">trigger match + qmd search</text>
  <text x="537" y="333" font-size="12" fill="#cbd0d8" text-anchor="middle">picks the team · sets gates</text>
  <text x="537" y="351" font-size="11.5" fill="#8b919c" text-anchor="middle" font-style="italic">confidence-scored, explainable</text>

  <!-- NEXUS above the engine -->
  <rect x="450" y="140" width="175" height="56" rx="14" fill="url(#gold)"/>
  <text x="537" y="165" font-size="15" font-weight="800" fill="#1a1a1a" text-anchor="middle">✦ NEXUS</text>
  <text x="537" y="184" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">meta-conductor</text>
  <line x1="537" y1="196" x2="537" y2="258" stroke="#f5b301" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowg)"/>
  <text x="551" y="234" font-size="12" fill="#f5b301" font-style="italic">idea? takes over</text>

  <!-- orchestra cards -->
  <g>
    <rect x="690" y="110" width="320" height="50" rx="11" fill="#1b1f26" stroke="#343a44"/>
    <text x="710" y="141" font-size="16" fill="#dfe3ea">🔨 <tspan font-weight="700" fill="#fff">BUILD</tspan> · architect</text>
    <rect x="690" y="172" width="320" height="50" rx="11" fill="#1b1f26" stroke="#343a44"/>
    <text x="710" y="203" font-size="16" fill="#dfe3ea">🎨 <tspan font-weight="700" fill="#fff">DESIGN</tspan> · ux-architect</text>
    <rect x="690" y="234" width="320" height="50" rx="11" fill="#1b1f26" stroke="#343a44"/>
    <text x="710" y="265" font-size="16" fill="#dfe3ea">🔬 <tspan font-weight="700" fill="#fff">RESEARCH</tspan> · research-agent</text>
    <rect x="690" y="296" width="320" height="50" rx="11" fill="#1b1f26" stroke="#343a44"/>
    <text x="710" y="327" font-size="16" fill="#dfe3ea">🛡️ <tspan font-weight="700" fill="#fff">AUDIT</tspan> · pressure-test gate</text>
    <rect x="690" y="358" width="320" height="50" rx="11" fill="#1b1f26" stroke="#343a44" stroke-dasharray="4 4"/>
    <text x="850" y="389" font-size="15" fill="#8b919c" text-anchor="middle">…17 more orchestras</text>
  </g>

  <!-- arrows: left flow -->
  <g stroke="#7a818c" stroke-width="2" fill="none">
    <line x1="195" y1="311" x2="231" y2="311" marker-end="url(#arrow)"/>
    <line x1="390" y1="311" x2="431" y2="311" marker-end="url(#arrow)"/>
  </g>
  <!-- engine → cards -->
  <g stroke="#7a818c" stroke-width="2" fill="none">
    <path d="M640 285 C660 270, 655 136, 686 136" marker-end="url(#arrow)"/>
    <path d="M640 297 C662 288, 658 198, 686 198" marker-end="url(#arrow)"/>
    <path d="M640 309 L686 262" marker-end="url(#arrow)"/>
    <path d="M640 321 C662 322, 658 320, 686 321" marker-end="url(#arrow)"/>
    <path d="M640 333 C662 350, 658 383, 686 383" marker-end="url(#arrow)"/>
  </g>

  <!-- announcement bar -->
  <rect x="55" y="520" width="955" height="84" rx="14" fill="#10241a" stroke="#1b9e4b" stroke-width="2"/>
  <text x="80" y="553" font-size="18" font-weight="700" fill="#3ddc84">🎼 DESIGN + BUILD active <tspan font-size="14" font-weight="600" fill="#8fd9ae">· confidence: high · ultracode</tspan></text>
  <text x="80" y="582" font-size="14" fill="#aeb6c2" font-family="ui-monospace, Menlo, monospace">Conductor: ux-architect → architect · Players: Figma, Canva, code-reviewer · Gate: /pressure-test</text>
  <path d="M760 408 C760 470, 520 470, 430 516" stroke="#1b9e4b" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrowgr)"/>
  <text x="612" y="487" font-size="12" fill="#1b9e4b" font-style="italic" text-anchor="middle">the winning team is announced · its conductor leads</text>

  <!-- feedback loop -->
  <rect x="55" y="648" width="955" height="56" rx="14" fill="#1b1f26" stroke="#f5b301" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="532" y="682" font-size="14.5" fill="#dfe3ea" text-anchor="middle">🏆 every tool use is counted → the <tspan font-weight="700" fill="#ffd45e">ranking board</tspan> re-ranks → cold skills go to the <tspan font-weight="700" fill="#ffd45e">bench</tspan> → the menu never overflows</text>
  <line x1="140" y1="604" x2="140" y2="644" stroke="#f5b301" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowg)"/>
  <text x="152" y="630" font-size="12" fill="#f5b301" font-style="italic">telemetry</text>
  <path d="M70 646 C40 480, 240 400, 431 336" stroke="#f5b301" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrowg)"/>
  <text x="120" y="452" font-size="12" fill="#f5b301" font-style="italic">feeds tomorrow's routing</text>
</svg>
